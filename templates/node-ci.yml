# Node.js 项目 CI 样板
#
# 接入步骤：
# 1. 复制本文件到你的仓库 .github/workflows/ci.yml
# 2. （可选）按需调整 with 下的参数（如 node-version, package-manager）
# 3. 在仓库 Settings → Secrets → Actions 配置 secrets（全部可选，缺失自动跳过）
# 4. 提交 PR，观察 CI 结果与企业微信通知

name: CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Yun-Hai-Org/ci-templates/.github/workflows/standard-ci.yml@main
    with:
      project-type: "node"
      node-version: "lts/*"
      package-manager: "npm" # npm / yarn / pnpm
      run-static-analysis: true
      run-security-scan: true
      run-dependency-audit: true
      run-unit-tests: true
      run-integration-tests: true
      run-e2e-tests: true
      fail-on-severity: "high"
      # ===== B+ 类：SonarQube（需 SONAR_TOKEN secret + sonar-organization） =====
      # sonar-organization: "your-sonarcloud-org" # 配置后启用 SonarQube 扫描
      # ===== D 类：上线前卡点（团队成熟后逐步开启） =====
      run-release-gates: false # 设为 true 启用 OPA test / 敏感数据 / Jira / Schema / commitlint
      jira-prefix: "PROJ" # 改成你的 Jira 项目前缀
      jira-warning-only: true # 过渡期：先 warning，团队习惯后改 false
      schema-check-paths: "agents/*.json" # 有 Agent 配置时启用
      # ===== E 类：上线后验证（schedule / 手动触发） =====
      run-ai-content-test: false
      run-load-test: false
      run-db-benchmark: false
      wecom-notify: true
    # secrets: inherit 自动透传 org/repo 级所有 secrets（WECOM_BOT_KEY /
    # SEMGREP_APP_TOKEN / SONAR_TOKEN / SNYK_TOKEN / GITGUARDIAN_API_KEY /
    # OPENAI_API_KEY / ANTHROPIC_API_KEY / TEST_DATABASE_URL / E2E_TARGET_URL /
    # E2E_AUTH_TOKEN 等），未配置的自动跳过
    secrets: inherit
