name: Dependency Audit

# C 类：依赖审计（dep-audit / py-dep-audit / lockfile-freshness）
# 被 standard-ci.yml 调用，不直接被业务项目调用。

on:
  workflow_call:
    inputs:
      project-type:
        type: string
        required: true
      run-osv-scanner:
        type: boolean
        default: false
        description: "Run OSV scanner (slow, recommended for scheduled runs)"
      fail-on-severity:
        type: string
        default: high
        description: "none / low / medium / high / critical"
      bun-version:
        type: string
        default: latest
      python-version:
        type: string
        default: "3.12"
      rust-version:
        type: string
        default: "stable"
        description: "Rust toolchain version"
      node-version:
        type: string
        default: "lts/*"
        description: "Node.js version"
      package-manager:
        type: string
        default: "npm"
        description: "Package manager: npm, yarn, or pnpm (node only)"
      working-directory:
        type: string
        default: .

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-bun@main
        with:
          bun-version: ${{ inputs.bun-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Python
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-python@main
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lockfile freshness (Bun)
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Lockfile freshness (Python)
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: uv sync --frozen

      - name: Bun audit
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: |
          if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
            bun audit --production || echo "::warning::bun audit found vulnerabilities (fail-on-severity=none)"
          else
            bun audit --production
          fi

      - name: pip-audit
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: |
          if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
            uv run pip-audit || echo "::warning::pip-audit found vulnerabilities (fail-on-severity=none)"
          else
            uv run pip-audit
          fi

      - name: Setup Rust
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-rust@main
        with:
          rust-version: ${{ inputs.rust-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lockfile freshness (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: cargo update --dry-run

      - name: cargo-audit (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: |
          cargo install cargo-audit
          if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
            cargo audit || echo "::warning::cargo-audit found vulnerabilities (fail-on-severity=none)"
          else
            cargo audit
          fi

      - name: Setup Node
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lockfile freshness (Node)
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        shell: bash
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            npm) npm ci ;;
            yarn) yarn install --immutable ;;
            pnpm) pnpm install --frozen-lockfile ;;
          esac

      - name: Node audit
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        shell: bash
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            npm)
              if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
                npm audit || echo "::warning::npm audit found vulnerabilities"
              else
                npm audit
              fi
              ;;
            yarn)
              if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
                yarn audit || echo "::warning::yarn audit found vulnerabilities"
              else
                yarn audit
              fi
              ;;
            pnpm)
              if [ "${{ inputs.fail-on-severity }}" = "none" ]; then
                pnpm audit || echo "::warning::pnpm audit found vulnerabilities"
              else
                pnpm audit
              fi
              ;;
          esac

      - name: Skip dependency audit (no manifest)
        if: |
          (inputs.project-type == 'bun' && hashFiles('package.json') == '') ||
          (inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') == '') ||
          (inputs.project-type == 'rust' && hashFiles('Cargo.toml') == '') ||
          (inputs.project-type == 'node' && hashFiles('package.json') == '')
        run: |
          PT="${{ inputs.project-type }}"
          case "$PT" in
            bun)    echo "::notice::no package.json, skipping bun audit" ;;
            python) echo "::notice::no Python manifest, skipping pip-audit" ;;
            rust)   echo "::notice::no Cargo.toml, skipping cargo-audit" ;;
            node)   echo "::notice::no package.json, skipping npm/yarn/pnpm audit" ;;
          esac

      - name: OSV Scanner
        if: inputs.run-osv-scanner == true
        run: |
          # 直接安装 osv-scanner CLI：google/osv-scanner-action 无 v1 tag
          VERSION=$(curl -sS https://api.github.com/repos/google/osv-scanner/releases/latest \
            | grep -oP '"tag_name":\s*"\Kv[^"]+')
          OSV_BASE="https://github.com/google/osv-scanner/releases/download"
          curl -fSL -o /tmp/osv-scanner \
            "${OSV_BASE}/${VERSION}/osv-scanner_linux_amd64"
          sudo cp /tmp/osv-scanner /usr/local/bin/osv-scanner
          sudo chmod 0755 /usr/local/bin/osv-scanner
          rm /tmp/osv-scanner
          set +e
          osv-scanner -r ./
          EXIT=$?
          case "$EXIT" in
            0) echo "✓ OSV Scanner 扫描通过" ;;
            1) echo "::error::OSV Scanner 发现漏洞，详见上方输出"; exit 1 ;;
            128) echo "::notice::OSV 无可扫描依赖（exit 128），模板仓库预期"; exit 0 ;;
            *) echo "::error::OSV Scanner 异常（exit $EXIT），详见上方输出"; exit 1 ;;
          esac

      - name: Skip OSV Scanner (disabled)
        if: inputs.run-osv-scanner != true
        run: |
          echo "::notice::run-osv-scanner=false，跳过 OSV 全量漏洞库扫描"
          echo "::notice::OSV 较慢，建议 schedule 触发：run-osv-scanner: true"
