name: Standard CI

# 对外唯一入口：业务项目通过 uses: ./.github/workflows/standard-ci.yml 调用。
# 内部编排 [lint / security / dependency / tests / release-gates] → notify-end。

on:
  workflow_call:
    inputs:
      project-type:
        type: string
        default: bun
        description: "bun or python (v1 supported types)"
      run-static-analysis:
        type: boolean
        default: true
        description: "Run A-class checks (type-check / lint / format)"
      run-security-scan:
        type: boolean
        default: true
        description: "Run B-class checks (semgrep / gitleaks / trivy / knip / checkov / conftest)"
      run-dependency-audit:
        type: boolean
        default: true
        description: "Run C-class checks (dep-audit / lockfile-freshness)"
      run-extended-lint:
        type: boolean
        default: false
        description: "Run hadolint / shellcheck / stylelint / sqlfluff"
      run-knip:
        type: boolean
        default: true
        description: "Run knip dead-code detection (bun only)"
      run-osv-scanner:
        type: boolean
        default: false
        description: "Run OSV scanner (slow, for scheduled runs)"
      # ===== 测试执行 =====
      run-unit-tests:
        type: boolean
        default: true
        description: "Run unit tests (bun test / pytest / cargo test / npm test)"
      run-integration-tests:
        type: boolean
        default: true
        description: "Run integration tests (gated by tests/integration/ existence)"
      run-e2e-tests:
        type: boolean
        default: true
        description: "Run E2E tests (Playwright/Cypress, gated by config existence)"
      test-command-bun-unit:
        type: string
        default: "bun test"
        description: "Bun unit test command"
      test-command-bun-integration:
        type: string
        default: "bun test tests/integration"
        description: "Bun integration test command"
      test-command-python-unit:
        type: string
        default: "uv run pytest"
        description: "Python unit test command"
      test-command-python-integration:
        type: string
        default: "uv run pytest tests/integration/"
        description: "Python integration test command"
      test-command-node-unit:
        type: string
        default: "npm test"
        description: "Node unit test command"
      test-command-node-integration:
        type: string
        default: "npm test -- tests/integration"
        description: "Node integration test command"
      e2e-framework:
        type: string
        default: "playwright"
        description: "E2E framework: playwright or cypress"
      rust-version:
        type: string
        default: "stable"
        description: "Rust toolchain version"
      node-version:
        type: string
        default: "lts/*"
        description: "Node.js version"
      package-manager:
        type: string
        default: "npm"
        description: "Package manager: npm, yarn, or pnpm (node only)"
      fail-on-severity:
        type: string
        default: high
        description: "none / low / medium / high / critical"
      sonar-organization:
        type: string
        default: ""
        description: "SonarCloud organization key（配置后启用 SonarQube 扫描）"
      bun-version:
        type: string
        default: latest
      python-version:
        type: string
        default: "3.12"
      working-directory:
        type: string
        default: .
      wecom-notify:
        type: boolean
        default: true
        description: "Send WeCom notification at CI end"
      # ===== D 类：上线前卡点 =====
      run-release-gates:
        type: boolean
        default: false
        description: "Run D-class release gates (OPA test / Semgrep custom / Jira / Schema / commitlint)"
      jira-prefix:
        type: string
        default: ""
        description: "Jira project prefix (e.g. PROJ). Empty = format-only check."
      jira-warning-only:
        type: boolean
        default: false
        description: "Jira check failures as warnings only (transition mode)"
      schema-check-paths:
        type: string
        default: ""
        description: "Agent config glob (e.g. 'agents/*.json'). Empty = skip Schema check."
      schema-file:
        type: string
        default: "templates/agent-config.schema.json"
        description: "JSON Schema file path for Schema check"
      # ===== E 类：上线后验证 =====
      run-ai-content-test:
        type: boolean
        default: false
        description: "Run promptfoo AI content safety test"
      run-load-test:
        type: boolean
        default: true
        description: "Run k6 / Locust load test"
      run-db-benchmark:
        type: boolean
        default: true
        description: "Run pgbench DB benchmark"
      promptfoo-test-path:
        type: string
        default: ./tests/promptfoo
        description: "promptfoo test directory"
      promptfoo-fail-threshold:
        type: number
        default: 0.5
        description: "promptfoo pass-rate threshold (0-1)"
      load-test-framework:
        type: string
        default: k6
        description: "load test framework: k6 or locust"
      load-test-script:
        type: string
        default: ./tests/load/scenario.js
        description: "load test script path"
      load-test-duration:
        type: string
        default: 30s
        description: "load test duration"
      load-test-vus:
        type: number
        default: 10
        description: "virtual users"
      load-test-target-url:
        type: string
        default: ""
        description: "load test target URL"
      db-pg-version:
        type: string
        default: "16"
        description: "PostgreSQL version for pgbench"
      db-scale-factor:
        type: number
        default: 10
        description: "pgbench scale factor"
      db-duration:
        type: number
        default: 60
        description: "pgbench duration (seconds)"
      db-threshold-tps:
        type: number
        default: 500
        description: "pgbench TPS threshold"
      debug:
        type: boolean
        default: false
        description: "Enable debug output"
    secrets:
      WECOM_BOT_KEY:
        required: false
      SEMGREP_APP_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      # ===== B+ 类外部安全服务 =====
      SONAR_TOKEN:
        required: false
      SNYK_TOKEN:
        required: false
      GITGUARDIAN_API_KEY:
        required: false
      # ===== E 类 AI 内容测试 =====
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      # ===== 测试执行 =====
      TEST_DATABASE_URL:
        required: false
      E2E_TARGET_URL:
        required: false
      E2E_AUTH_TOKEN:
        required: false

# 嵌套调用 security-scans.yml / release-gates.yml 的 upload-sarif 需要
# security-events: write；notify-end 查询 jobs API 需要 actions: read。
# 调用方（业务仓库 ci.yml 或 smoke-test.yml）需显式授予 actions: read + security-events: write
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  lint:
    name: Lint & Format
    if: ${{ inputs.run-static-analysis == true }}
    uses: ./.github/workflows/lint-checks.yml
    with:
      project-type: ${{ inputs.project-type }}
      run-extended-lint: ${{ inputs.run-extended-lint }}
      bun-version: ${{ inputs.bun-version }}
      python-version: ${{ inputs.python-version }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  security:
    name: Security Scan
    if: ${{ inputs.run-security-scan == true }}
    uses: ./.github/workflows/security-scans.yml
    with:
      project-type: ${{ inputs.project-type }}
      run-knip: ${{ inputs.run-knip }}
      fail-on-severity: ${{ inputs.fail-on-severity }}
      sonar-organization: ${{ inputs.sonar-organization }}
      bun-version: ${{ inputs.bun-version }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  dependency:
    name: Dependency Audit
    if: ${{ inputs.run-dependency-audit == true }}
    uses: ./.github/workflows/dependency-audit.yml
    with:
      project-type: ${{ inputs.project-type }}
      run-osv-scanner: ${{ inputs.run-osv-scanner }}
      fail-on-severity: ${{ inputs.fail-on-severity }}
      bun-version: ${{ inputs.bun-version }}
      python-version: ${{ inputs.python-version }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  tests:
    name: Tests
    if: ${{ inputs.run-unit-tests == true || inputs.run-integration-tests == true || inputs.run-e2e-tests == true }}
    uses: ./.github/workflows/tests.yml
    with:
      project-type: ${{ inputs.project-type }}
      run-unit-tests: ${{ inputs.run-unit-tests }}
      run-integration-tests: ${{ inputs.run-integration-tests }}
      run-e2e-tests: ${{ inputs.run-e2e-tests }}
      test-command-bun-unit: ${{ inputs.test-command-bun-unit }}
      test-command-bun-integration: ${{ inputs.test-command-bun-integration }}
      test-command-python-unit: ${{ inputs.test-command-python-unit }}
      test-command-python-integration: ${{ inputs.test-command-python-integration }}
      test-command-node-unit: ${{ inputs.test-command-node-unit }}
      test-command-node-integration: ${{ inputs.test-command-node-integration }}
      e2e-framework: ${{ inputs.e2e-framework }}
      bun-version: ${{ inputs.bun-version }}
      python-version: ${{ inputs.python-version }}
      rust-version: ${{ inputs.rust-version }}
      node-version: ${{ inputs.node-version }}
      package-manager: ${{ inputs.package-manager }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  # ===== D 类：上线前卡点（与 A/B/C 并行） =====
  release-gates:
    name: Release Gates (D)
    if: ${{ inputs.run-release-gates == true }}
    uses: ./.github/workflows/release-gates.yml
    with:
      project-type: ${{ inputs.project-type }}
      jira-prefix: ${{ inputs.jira-prefix }}
      jira-warning-only: ${{ inputs.jira-warning-only }}
      schema-check-paths: ${{ inputs.schema-check-paths }}
      schema-file: ${{ inputs.schema-file }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  # ===== E 类：上线后验证（依赖 D 类通过） =====
  ai-content:
    name: AI Content Test (E)
    if: ${{ inputs.run-ai-content-test == true && needs.release-gates.result == 'success' }}
    needs: [release-gates]
    uses: ./.github/workflows/ai-content-test.yml
    with:
      test-path: ${{ inputs.promptfoo-test-path }}
      fail-threshold: ${{ inputs.promptfoo-fail-threshold }}
      working-directory: ${{ inputs.working-directory }}
    secrets: inherit

  load-test:
    name: Load Test (E)
    if: ${{ inputs.run-load-test == true && needs.release-gates.result == 'success' }}
    needs: [release-gates]
    uses: ./.github/workflows/load-test.yml
    with:
      framework: ${{ inputs.load-test-framework }}
      test-script: ${{ inputs.load-test-script }}
      duration: ${{ inputs.load-test-duration }}
      vus: ${{ inputs.load-test-vus }}
      target-url: ${{ inputs.load-test-target-url }}
      working-directory: ${{ inputs.working-directory }}

  db-benchmark:
    name: DB Benchmark (E)
    if: ${{ inputs.run-db-benchmark == true && needs.release-gates.result == 'success' }}
    needs: [release-gates]
    uses: ./.github/workflows/db-benchmark.yml
    with:
      pg-version: ${{ inputs.db-pg-version }}
      scale-factor: ${{ inputs.db-scale-factor }}
      duration: ${{ inputs.db-duration }}
      report-threshold-tps: ${{ inputs.db-threshold-tps }}

  notify-end:
    name: Notify CI End (WeCom)
    needs: [lint, security, dependency, tests, release-gates, ai-content, load-test, db-benchmark]
    if: ${{ always() && inputs.wecom-notify == true }}
    runs-on: ubuntu-latest
    env:
      WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
    steps:
      - name: Compute overall status
        id: status
        shell: bash
        run: |
          # 查询 GitHub API 获取 step 级别跳过状态（reusable workflow 共享 run_id）
          API_BASE="https://api.github.com/repos/${{ github.repository }}"
          API_URL="${API_BASE}/actions/runs/${{ github.run_id }}/jobs?per_page=100"
          curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            -o /tmp/run_jobs.json || true
          python3 - <<'PYEOF'
          import json
          try:
              with open('/tmp/run_jobs.json') as f:
                  data = json.load(f)
          except Exception:
              data = {'jobs': []}
          cats = {
              'LINT': 'Lint & Format',
              'SEC': 'Security Scan',
              'DEP': 'Dependency Audit',
              'TESTS': ' / Tests /',
              'GATES': 'Release Gates (D)',
              'AI': 'AI Content Test (E)',
              'LOAD': 'Load Test (E)',
              'DB': 'DB Benchmark (E)',
          }
          lines = []
          for cat, kw in cats.items():
              skip = '0'
              for j in data.get('jobs', []):
                  if kw in j.get('name', ''):
                      for s in (j.get('steps') or []):
                          if s.get('conclusion') == 'skipped':
                              skip = '1'
                              break
                  if skip == '1':
                      break
              lines.append(cat + '_STEP_SKIP=' + skip)
          open('/tmp/step_skips.sh', 'w').write('\n'.join(lines) + '\n')
          PYEOF
          . /tmp/step_skips.sh

          if [ "${{ inputs.run-static-analysis }}" != "true" ]; then
            LINT="skipped"
          else
            LINT="${{ needs.lint.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-security-scan }}" != "true" ]; then
            SEC="skipped"
          else
            SEC="${{ needs.security.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-dependency-audit }}" != "true" ]; then
            DEP="skipped"
          else
            DEP="${{ needs.dependency.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-unit-tests }}" != "true" ] &&
             [ "${{ inputs.run-integration-tests }}" != "true" ] &&
             [ "${{ inputs.run-e2e-tests }}" != "true" ]; then
            TESTS="skipped"
          else
            TESTS="${{ needs.tests.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-release-gates }}" != "true" ]; then
            GATES="skipped"
          else
            GATES="${{ needs.release-gates.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-ai-content-test }}" != "true" ] || [ "$GATES" != "success" ]; then
            AI="skipped"
          else
            AI="${{ needs.ai-content.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-load-test }}" != "true" ] || [ "$GATES" != "success" ]; then
            LOAD="skipped"
          else
            LOAD="${{ needs.load-test.result || 'skipped' }}"
          fi

          if [ "${{ inputs.run-db-benchmark }}" != "true" ] || [ "$GATES" != "success" ]; then
            DB="skipped"
          else
            DB="${{ needs.db-benchmark.result || 'skipped' }}"
          fi

          # result 转 emoji + 中文
          result_icon() {
            case "$1" in
              success) if [ "$2" = "1" ]; then echo "🟡 部分跳过"; else echo "✅ 成功"; fi ;;
              failure) echo "❌ 失败" ;;
              skipped) echo "⊘ 跳过" ;;
              *)       echo "❓ $1" ;;
            esac
          }

          FAIL=0
          [ "$LINT" = "failure" ] && FAIL=1
          [ "$SEC" = "failure" ] && FAIL=1
          [ "$DEP" = "failure" ] && FAIL=1
          [ "$GATES" = "failure" ] && FAIL=1
          [ "$AI" = "failure" ] && FAIL=1
          [ "$LOAD" = "failure" ] && FAIL=1
          [ "$DB" = "failure" ] && FAIL=1
          [ "$TESTS" = "failure" ] && FAIL=1

          SKIP=0
          [ "$LINT" = "skipped" ] && SKIP=1
          [ "$SEC" = "skipped" ] && SKIP=1
          [ "$DEP" = "skipped" ] && SKIP=1
          [ "$TESTS" = "skipped" ] && SKIP=1
          [ "$GATES" = "skipped" ] && SKIP=1
          [ "$AI" = "skipped" ] && SKIP=1
          [ "$LOAD" = "skipped" ] && SKIP=1
          [ "$DB" = "skipped" ] && SKIP=1
          [ "$LINT" = "success" ] && [ "$LINT_STEP_SKIP" = "1" ] && SKIP=1
          [ "$SEC" = "success" ] && [ "$SEC_STEP_SKIP" = "1" ] && SKIP=1
          [ "$DEP" = "success" ] && [ "$DEP_STEP_SKIP" = "1" ] && SKIP=1
          [ "$TESTS" = "success" ] && [ "$TESTS_STEP_SKIP" = "1" ] && SKIP=1
          [ "$GATES" = "success" ] && [ "$GATES_STEP_SKIP" = "1" ] && SKIP=1
          [ "$AI" = "success" ] && [ "$AI_STEP_SKIP" = "1" ] && SKIP=1
          [ "$LOAD" = "success" ] && [ "$LOAD_STEP_SKIP" = "1" ] && SKIP=1
          [ "$DB" = "success" ] && [ "$DB_STEP_SKIP" = "1" ] && SKIP=1

          LINT_ICON=$(result_icon "$LINT" "$LINT_STEP_SKIP")
          SEC_ICON=$(result_icon "$SEC" "$SEC_STEP_SKIP")
          DEP_ICON=$(result_icon "$DEP" "$DEP_STEP_SKIP")
          GATES_ICON=$(result_icon "$GATES" "$GATES_STEP_SKIP")
          AI_ICON=$(result_icon "$AI" "$AI_STEP_SKIP")
          LOAD_ICON=$(result_icon "$LOAD" "$LOAD_STEP_SKIP")
          DB_ICON=$(result_icon "$DB" "$DB_STEP_SKIP")
          TESTS_ICON=$(result_icon "$TESTS" "$TESTS_STEP_SKIP")

          if [ "$FAIL" = "1" ]; then
            echo "title=❌ CI 失败" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP" = "1" ]; then
            echo "title=✅ CI 完成（部分跳过）" >> "$GITHUB_OUTPUT"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "title=✅ CI 完成" >> "$GITHUB_OUTPUT"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

          # 多行 output 用 DELIMITER 语法
          # 注意：extra 行格式为 "emoji 名称　状态"，notify-wecom action 解析为模板卡片 horizontal_content_list
          {
            echo "extra<<EOF"
            echo "📋 检查结果"
            echo "🔍 静态分析　${LINT_ICON}"
            echo "🛡️ 安全扫描　${SEC_ICON}"
            echo "📦 依赖审计　${DEP_ICON}"
            echo "🚦 上线卡点　${GATES_ICON}"
            echo "🤖 AI 内容　${AI_ICON}"
            echo "⚡ 压测　　　${LOAD_ICON}"
            echo "🗄️ DB 基准　${DB_ICON}"
            echo "🧪 测试　　　${TESTS_ICON}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send WeCom notification (template_card)
        if: ${{ env.WECOM_BOT_KEY != '' }}
        shell: bash
        env:
          WECOM_BOT_KEY: ${{ env.WECOM_BOT_KEY }}
          TITLE: ${{ steps.status.outputs.title }}
          STATUS: ${{ steps.status.outputs.status }}
          EXTRA: ${{ steps.status.outputs.extra }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.request

          title = os.environ.get('TITLE', '')
          status = os.environ.get('STATUS', '')
          extra = os.environ.get('EXTRA', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          actor = os.environ.get('GITHUB_ACTOR', '')
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          server_url = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          key = os.environ.get('WECOM_BOT_KEY', '')

          ref = os.environ.get('GITHUB_REF', '')
          branch = ref[11:] if ref.startswith('refs/heads/') else ref
          if event == 'pull_request':
              head = os.environ.get('GITHUB_HEAD_REF', '')
              if head:
                  branch = head

          run_url = server_url + '/' + repo + '/actions/runs/' + run_id

          status_icons = {'success': '✅', 'failure': '❌', 'started': '🚀'}
          status_icon = status_icons.get(status, 'ℹ️')
          status_cn = {'success': '成功', 'failure': '失败', 'started': '开始'}
          status_text = status_cn.get(status, status)
          event_cn = {'pull_request': 'Pull Request', 'push': 'Push',
                      'workflow_dispatch': '手动触发', 'schedule': '定时任务'}
          event_text = event_cn.get(event, event)

          hcl = [{'keyname': '触发者', 'value': actor},
                 {'keyname': '事件', 'value': event_text}]

          if extra:
              for line in extra.split('\n'):
                  line = line.strip()
                  if not line or '检查结果' in line:
                      continue
                  parts = [p for p in line.split(chr(0x3000)) if p.strip()]
                  if len(parts) < 2:
                      continue
                  kn = parts[0].split(' ', 1)
                  keyname = kn[-1] if len(kn) == 2 else kn[0]
                  hcl.append({'keyname': keyname, 'value': parts[1].strip()})

          card = {
              'card_type': 'text_notice',
              'main_title': {'title': title, 'desc': repo},
              'emphasis_content': {'title': status_icon, 'desc': status_text},
              'sub_title_text': '分支: ' + branch,
              'horizontal_content_list': hcl,
              'card_action': {'type': 1, 'url': run_url},
          }
          payload = json.dumps({'msgtype': 'template_card', 'template_card': card})

          url = 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=' + key
          req = urllib.request.Request(url, data=payload.encode('utf-8'),
                                       headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  body = resp.read().decode('utf-8')
              result = json.loads(body)
              if result.get('errcode') == 0:
                  print('WeCom notification sent: ' + title)
              else:
                  print('::warning::WeCom webhook returned ' + body)
          except Exception as e:
              print('::warning::WeCom notification failed: ' + str(e))
          PYEOF

      - name: Skip WeCom notification (no key)
        if: ${{ env.WECOM_BOT_KEY == '' }}
        shell: bash
        run: echo "::warning::secret WECOM_BOT_KEY not set, skipping WeCom notification"
