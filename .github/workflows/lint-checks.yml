name: Lint Checks

# A 类：静态分析与格式化（type-check / lint / extended-lint / format）
# 被 standard-ci.yml 调用，不直接被业务项目调用。

on:
  workflow_call:
    inputs:
      project-type:
        type: string
        required: true
        description: "Project type: bun or python"
      run-extended-lint:
        type: boolean
        default: false
        description: "Run hadolint / shellcheck / stylelint / sqlfluff"
      bun-version:
        type: string
        default: latest
      python-version:
        type: string
        default: "3.12"
      rust-version:
        type: string
        default: "stable"
        description: "Rust toolchain version"
      node-version:
        type: string
        default: "lts/*"
        description: "Node.js version"
      package-manager:
        type: string
        default: "npm"
        description: "Package manager: npm, yarn, or pnpm (node only)"
      working-directory:
        type: string
        default: .

jobs:
  static-analysis:
    name: Static Analysis & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-bun@2449d61c5cebe44b6b12c1dc452ad5373d94a0c8
        with:
          bun-version: ${{ inputs.bun-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Python
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-python@2449d61c5cebe44b6b12c1dc452ad5373d94a0c8
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install deps (Bun)
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Install deps (Python)
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: uv sync --frozen

      - name: Type check (Bun)
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: bunx tsc --noEmit

      - name: Type check (Python)
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: uv run pyright .

      - name: Lint (Bun)
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: bun eslint --max-warnings 0 .

      - name: Lint (Python)
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: uv run ruff check .

      - name: Format check (Bun)
        if: inputs.project-type == 'bun' && hashFiles('package.json') != ''
        run: bun prettier --check .

      - name: Format check (Python)
        if: inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') != ''
        run: uv run ruff format --check .

      - name: Setup Rust
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-rust@2449d61c5cebe44b6b12c1dc452ad5373d94a0c8
        with:
          rust-version: ${{ inputs.rust-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install deps (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: cargo fetch

      - name: Type check (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: cargo check --all-targets

      - name: Lint (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check (Rust)
        if: inputs.project-type == 'rust' && hashFiles('Cargo.toml') != ''
        run: cargo fmt --check

      - name: Setup Node
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-node@2449d61c5cebe44b6b12c1dc452ad5373d94a0c8
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install deps (Node)
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        shell: bash
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            npm) npm ci ;;
            yarn) yarn install --immutable ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *) echo "::error::Unknown package-manager: $PM" && exit 1 ;;
          esac

      - name: Type check (Node)
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        run: npx tsc --noEmit

      - name: Lint (Node)
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        run: npx eslint --max-warnings 0 .

      - name: Format check (Node)
        if: inputs.project-type == 'node' && hashFiles('package.json') != ''
        run: npx prettier --check .

      - name: Skip static analysis (no manifest)
        if: |
          (inputs.project-type == 'bun' && hashFiles('package.json') == '') ||
          (inputs.project-type == 'python' && hashFiles('pyproject.toml', 'setup.py', 'requirements.txt') == '') ||
          (inputs.project-type == 'rust' && hashFiles('Cargo.toml') == '') ||
          (inputs.project-type == 'node' && hashFiles('package.json') == '')
        run: |
          PT="${{ inputs.project-type }}"
          case "$PT" in
            bun)  echo "::notice::no package.json, skipping bun tsc/eslint/prettier" ;;
            python) echo "::notice::no pyproject.toml/setup.py/requirements.txt, skipping pyright/ruff" ;;
            rust)  echo "::notice::no Cargo.toml, skipping cargo check/clippy/fmt" ;;
            node)  echo "::notice::no package.json, skipping npx tsc/eslint/prettier" ;;
          esac

  extended-lint:
    name: Extended Lint
    needs: static-analysis
    if: inputs.run-extended-lint == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - name: hadolint (Dockerfile)
        if: hashFiles('**/Dockerfile') != ''
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile"

      - name: Skip hadolint (no Dockerfile)
        if: hashFiles('**/Dockerfile') == ''
        run: echo "::notice::未发现 Dockerfile，跳过 hadolint"

      - name: shellcheck
        if: hashFiles('**/*.sh') != ''
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: Skip shellcheck (no .sh files)
        if: hashFiles('**/*.sh') == ''
        run: echo "::notice::未发现 *.sh 脚本，跳过 shellcheck"

      - name: Setup Bun (for stylelint)
        if: hashFiles('**/*.css') != '' && inputs.project-type == 'bun'
        uses: Yun-Hai-Org/ci-templates/.github/actions/setup-bun@2449d61c5cebe44b6b12c1dc452ad5373d94a0c8
        with:
          bun-version: ${{ inputs.bun-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: stylelint
        if: hashFiles('**/*.css') != '' && inputs.project-type == 'bun'
        run: |
          bun install --frozen-lockfile
          bunx stylelint "**/*.css"

      - name: Skip stylelint (no CSS or non-bun)
        if: hashFiles('**/*.css') == '' || inputs.project-type != 'bun'
        run: |
          if [ "${{ inputs.project-type }}" != "bun" ]; then
            echo "::notice::project-type=${{ inputs.project-type }}，stylelint 仅适用 bun 项目，跳过"
          else
            echo "::notice::未发现 *.css 文件，跳过 stylelint"
          fi

      - name: sqlfluff
        if: hashFiles('**/*.sql') != ''
        run: |
          pip install sqlfluff
          sqlfluff lint "**/*.sql"

      - name: Skip sqlfluff (no SQL files)
        if: hashFiles('**/*.sql') == ''
        run: echo "::notice::未发现 *.sql 文件，跳过 sqlfluff"
