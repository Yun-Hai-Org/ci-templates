name: Setup Rust
description: Install Rust toolchain and cache cargo registry/target based on Cargo.lock hash.

inputs:
  rust-version:
    description: Rust toolchain version (e.g. 'stable', 'nightly', '1.75.0').
    required: false
    default: stable
  working-directory:
    description: Directory containing Cargo.toml.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.working-directory }}/target
        key: rust-${{ runner.os }}-${{ inputs.rust-version }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          rust-${{ runner.os }}-${{ inputs.rust-version }}-
